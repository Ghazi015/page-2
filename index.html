<!DOCTYPE html>
<html lang="id" class="lock">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JOSC Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050507;color:#f4ecdf;font-family:Georgia,serif;overflow-x:hidden}
html.lock,html.lock body{overflow:hidden;height:100%}
section{position:relative;height:100vh;height:100svh;overflow:hidden}
.gold{background:linear-gradient(180deg,#fbe7b0,#c8963e 55%,#f3d58a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{position:absolute;top:6vh;left:0;right:0;z-index:5;text-align:center;font-size:clamp(1.4rem,5vw,2.6rem);letter-spacing:.08em;pointer-events:none}

.stage{position:fixed;inset:0;z-index:0}
.sky{position:absolute;inset:0}
.studio{background:radial-gradient(circle at 50% 45%,#fdfbf7,#e4ddd2 75%)}
.space{background:radial-gradient(circle at 50% 50%,#12203f,#05070f 55%,#000);opacity:0}
.aurum{background:radial-gradient(circle at 50% 50%,#3a2708,#0b0703 55%,#000);opacity:0}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#ffe6b0 60%,#ffcf7a);opacity:0;pointer-events:none}

.hero{z-index:1;display:grid;place-items:end center;padding-bottom:7vh;pointer-events:none;text-align:center}
.hero-copy>*{opacity:0;transform:translateY(20px)}
.hero h1{font-size:clamp(2rem,min(10vw,9vh),5.4rem);letter-spacing:.04em;filter:drop-shadow(0 4px 18px rgba(0,0,0,.8))}
.hero p{margin:.5rem auto 0;max-width:30ch;font-style:italic;font-size:clamp(.75rem,min(3.2vw,3.4vh),1.05rem);color:#f4ecdfd9;text-shadow:0 2px 10px #000}
.hero small{display:block;margin-top:.8rem;font-size:clamp(.6rem,min(2.6vw,2.8vh),.8rem);color:#f4ecdf99;letter-spacing:.1em}

.wind{z-index:2;background:radial-gradient(circle at 20% 50%,#241a10,#0b0806 70%)}
.card{position:absolute;left:0;top:0;width:clamp(84px,22vmin,170px);aspect-ratio:3/4;border:4px solid #f6efe2;border-radius:6px;
  background:var(--img) center/cover no-repeat,linear-gradient(150deg,#8a6a45,#2a1d12);box-shadow:0 10px 25px rgba(0,0,0,.55);opacity:0;will-change:transform,opacity}

.shelf-sec{z-index:2;background:#1a0f08}
.shelf{position:absolute;inset:0;display:flex;flex-direction:column;padding:14vh 3vw 3vh}
.row{position:relative;flex:1;display:flex;align-items:flex-end;gap:2px;padding:0 6px;overflow:hidden;
  background:linear-gradient(#120a05,#2a190d);border-bottom:14px solid #6b4526;box-shadow:inset 0 -18px 28px rgba(0,0,0,.6)}
.spine{flex:none;border-radius:2px 2px 0 0;
  background:linear-gradient(transparent 12%,#c9a25a 12% 14%,transparent 14% 84%,#c9a25a 84% 86%,transparent 86%),
    linear-gradient(90deg,rgba(0,0,0,.45),transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%,rgba(0,0,0,.45)),hsl(var(--h) var(--s) var(--l))}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none}
.albums{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;align-content:center;gap:5vmin 4vmin;padding:14vh 6vw 4vh;perspective:900px;pointer-events:none}
.album,.bk.nb{background:url(assets/cover.jpg) center/cover,#efe6d6}
.album{position:relative;width:clamp(80px,24vmin,200px);aspect-ratio:413/580;border-radius:3px 6px 6px 3px;opacity:0;will-change:transform,opacity;box-shadow:0 18px 34px rgba(0,0,0,.65)}
.album::before,.bk.nb::before{content:"";position:absolute;left:-5px;top:4%;bottom:4%;width:10px;border-radius:5px;
  background:repeating-linear-gradient(#111 0 3px,#555 3px 4px,transparent 4px 9px)}

.shelves{z-index:2;background:#0b0806;display:flex;flex-direction:column;justify-content:center;gap:4vh}
.shelves h2{text-align:center;font-size:clamp(1.4rem,5vw,2.6rem);letter-spacing:.08em}
.track{display:flex;width:max-content;align-items:flex-end;padding-left:8px;box-shadow:0 12px 0 #4a2f1c;will-change:transform}
.bk{position:relative;flex:none;margin-right:18px;width:clamp(76px,19vmin,140px);aspect-ratio:2/3;border-radius:3px 7px 7px 3px;
  box-shadow:inset 8px 0 10px rgba(0,0,0,.45),0 10px 18px rgba(0,0,0,.55)}
.bk.lt{background:url(assets/leather.jpg) center/cover,#5c381e;filter:hue-rotate(var(--hr)) brightness(var(--br))}
.bk.lt span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12%;font-size:clamp(.65rem,2.4vmin,.95rem);letter-spacing:.12em;text-transform:uppercase;color:#e7c677;text-shadow:0 1px 0 #000}
.bk.ph{background:var(--img) center/cover,#2a1d12;border:3px solid #f6efe2}
</style>
</head>
<body>
<div class="stage">
  <div class="sky studio"></div>
  <div class="sky space"></div>
  <div class="sky aurum"></div>
  <canvas id="gl"></canvas>
  <div class="flash"></div>
</div>

<section class="hero">
  <div class="hero-copy">
    <h1 class="gold">JOSC Gallery</h1>
    <p>“A collection of moments, a story in pictures, a life well-lived.”</p>
    <small>GESER UNTUK MEMUTAR · KETUK UNTUK MENGUBAH · SCROLL</small>
  </div>
</section>

<section class="wind"><h2 class="tag gold">Hembusan Kenangan</h2></section>

<section class="shelf-sec">
  <div class="shelf"></div>
  <div class="shade"></div>
  <h2 class="tag gold">Album dari Rak</h2>
  <div class="albums"></div>
</section>

<section class="shelves">
  <h2 class="gold">Rak Tanpa Ujung</h2>
  <div class="track"></div>
  <div class="track"></div>
  <div class="track"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
gsap.registerPlugin(ScrollTrigger);
history.scrollRestoration = 'manual';
scrollTo(0, 0);

const $ = s => document.querySelector(s);
const el = (cls, css = '', html = '') => Object.assign(document.createElement('div'), { className: cls, style: css, innerHTML: html });
const CARDS = Array.from({ length: 10 }, (_, i) => `assets/card${i + 1}.jpg`);
const rnd = (a, b) => a + Math.random() * (b - a);

let renderer, camera;

function unlock() {
  document.documentElement.classList.remove('lock');
  ScrollTrigger.refresh();
}

// ---------- Section 2: kartu foto tertiup angin ----------
{
  const wind = $('.wind');
  const N = 26;
  const cards = Array.from({ length: N }, (_, i) => wind.appendChild(el('card', `--img:url(${CARDS[i % CARDS.length]})`)));
  const seed = cards.map(() => [Math.random(), Math.random(), Math.random()]);
  const W = () => wind.clientWidth, H = () => wind.clientHeight;
  const cw = () => cards[0].offsetWidth, ch = () => cards[0].offsetHeight;
  const pad = () => H() * .14;

  const tl = gsap.timeline({ scrollTrigger: { trigger: wind, start: 'top top', end: '+=220%', pin: true, scrub: 1, invalidateOnRefresh: true } });
  cards.forEach((c, i) => {
    const [a, b, r] = seed[i], at = i * .04;
    tl.fromTo(c,
      { x: () => -cw() * 1.5 - a * W() * .4, y: () => b * (H() - ch()), rotation: (r - .5) * 360, opacity: 0 },
      { x: () => W() * (.3 + a * .3), y: () => H() * (.5 + Math.sin(i * 1.7) * .3) - ch() / 2, rotation: (r - .5) * 120, opacity: 1, duration: .5, ease: 'sine.in' }, at)
      // Step vertikal < tinggi kartu → kartu saling tumpang tindih membentuk kolom rapat memanjang di kanan.
      .to(c, {
        x: () => W() - cw() - W() * .04 - (i % 2) * 8,
        y: () => pad() + i * (H() - ch() - pad() * 1.3) / (N - 1),
        rotation: i % 2 ? 4 : -4, duration: .5, ease: 'power3.out'
      }, at + .5);
  });
}

// ---------- Section 3: album JOSC keluar dari rak ----------
{
  const sec = $('.shelf-sec'), shelf = $('.shelf'), box = $('.albums');
  const ROWS = 4;
  const rows = Array.from({ length: ROWS }, () => {
    const r = shelf.appendChild(el('row'));
    r.innerHTML = Array.from({ length: 40 }, () =>
      `<i class="spine" style="width:${rnd(14, 36) | 0}px;height:${rnd(66, 96) | 0}%;--h:${rnd(10, 40) | 0};--s:${rnd(30, 60) | 0}%;--l:${rnd(14, 34) | 0}%"></i>`).join('');
    return r;
  });
  const albums = Array.from({ length: 6 }, () => box.appendChild(el('album')));
  const sources = albums.map((_, i) => {
    const s = rows[i % ROWS].children[3 + (i / ROWS | 0) * 5];
    s.style.cssText += ';--h:38;--s:30%;--l:82%';
    return s;
  });

  // offsetLeft/Top (bukan getBoundingClientRect) agar posisi tidak terkontaminasi transform GSAP saat refresh.
  const pos = n => {
    let x = n.offsetWidth / 2, y = n.offsetHeight / 2;
    for (; n && n !== sec; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
    return { x, y };
  };

  const tl = gsap.timeline({ scrollTrigger: { trigger: sec, start: 'top top', end: '+=240%', pin: true, scrub: 1, invalidateOnRefresh: true } });
  tl.to('.shade', { opacity: 1, duration: 1 }, 0);
  albums.forEach((a, i) => {
    const s = sources[i], at = i * .35;
    tl.to(s, { yPercent: -22, duration: .2 }, at)
      .to(s, { opacity: 0, duration: .05 }, at + .2)
      .fromTo(a,
        { x: () => pos(s).x - pos(a).x, y: () => pos(s).y - pos(a).y, scale: () => s.offsetHeight / a.offsetHeight, rotationY: 88, opacity: 0 },
        { x: 0, y: 0, scale: 1, rotationY: 0, rotation: (i % 3 - 1) * 4, duration: 1, ease: 'power2.inOut' }, at + .2)
      .to(a, { opacity: 1, duration: .12 }, at + .2);
  });
}

// ---------- Section 4: 3 baris buku berjalan ----------
{
  const titles = ['Kenangan', 'Senja', 'Aksara', 'Rindu', 'Jejak', 'Pulang', 'Cahaya', 'Waktu'];
  const book = (i, r) => {
    const k = (i + r) % 3;
    if (k === 0) return '<div class="bk nb"></div>';
    if (k === 1) return `<div class="bk lt" style="--hr:${(i * 13 + r * 7) % 40 - 20}deg;--br:${.75 + (i % 4) * .12}"><span>${titles[(i + r) % titles.length]}</span></div>`;
    return `<div class="bk ph" style="--img:url(${CARDS[(i + r * 3) % CARDS.length]})"></div>`;
  };
  const loops = [...document.querySelectorAll('.track')].map((tr, r) => {
    const html = Array.from({ length: 14 }, (_, i) => book(i, r)).join('');
    tr.innerHTML = html + html; // duplikat agar loop xPercent -50 ↔ 0 mulus tanpa celah
    const right = r % 2 === 0;
    return gsap.fromTo(tr, { xPercent: right ? -50 : 0 }, { xPercent: right ? 0 : -50, duration: 30 + r * 5, ease: 'none', repeat: -1, paused: true });
  });
  ScrollTrigger.create({ trigger: '.shelves', start: 'top bottom', end: 'bottom top', onToggle: s => loops.forEach(t => s.isActive ? t.play() : t.pause()) });
}

// ---------- Section 1: Three.js ----------
async function initGL() {
  const canvas = $('#gl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 100);
  camera.zoom = Math.min(1, camera.aspect * .9);
  camera.updateProjectionMatrix();
  scene.add(new THREE.AmbientLight(0xffffff, 1.1));
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
  sun.position.set(3, 4, 6);
  const glowLight = new THREE.PointLight(0xffc47a, 18, 12);
  glowLight.position.set(0, 0, 1.5);
  scene.add(sun);
  const world = new THREE.Group();
  scene.add(world);

  const canvasTex = (w, h, draw) => {
    const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  const radial = stops => canvasTex(256, 256, (g, w) => {
    const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    stops.forEach(([o, c]) => r.addColorStop(o, c));
    g.fillStyle = r;
    g.fillRect(0, 0, w, w);
  });
  const fallback = label => canvasTex(256, 360, (g, w, h) => {
    g.fillStyle = '#5c381e'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#e7c677'; g.font = '28px Georgia'; g.textAlign = 'center'; g.fillText(label, w / 2, h / 2);
  });

  const loader = new THREE.TextureLoader();
  const files = { cover: 'assets/cover.jpg', ancient: 'assets/ancient.jpg', leather: 'assets/leather.jpg', woman: 'assets/woman.webp' };
  const tex = Object.fromEntries(await Promise.all(Object.entries(files).map(([k, url]) =>
    loader.loadAsync(url).catch(() => fallback(k)).then(t => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return [k, t];
    }))));

  const std = o => new THREE.MeshStandardMaterial({ roughness: .6, ...o });
  const additive = o => ({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, ...o });
  const pageMat = std({ color: 0xf2e8d5, roughness: .9 });

  // --- Notebook foto 1 (spiral) ---
  const NW = 1.85, NH = 2.6, ND = .3;
  const notebook = new THREE.Group();
  world.add(notebook);
  const pageTex = canvasTex(256, 360, (g, w, h) => {
    g.fillStyle = '#f5ecd9'; g.fillRect(0, 0, w, h);
    const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, h / 2);
    r.addColorStop(0, '#fff6d8'); r.addColorStop(.3, '#ffc766'); r.addColorStop(1, 'rgba(245,236,217,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
  const pageFront = std({ map: pageTex, emissive: 0xffc070, emissiveMap: pageTex, emissiveIntensity: 0 });
  const pages = new THREE.Mesh(new THREE.BoxGeometry(NW - .06, NH - .06, ND - .08), [pageMat, pageMat, pageMat, pageMat, pageFront, pageMat]);
  const boardMat = std({ color: 0xe8dccb, transparent: true });
  const coverMat = std({ map: tex.cover, transparent: true, roughness: .5 });
  const boardGeo = new THREE.BoxGeometry(NW, NH, .04);
  const cover = new THREE.Mesh(boardGeo, [boardMat, boardMat, boardMat, boardMat, coverMat, boardMat]);
  const back = new THREE.Mesh(boardGeo, boardMat);
  const hinge = new THREE.Group();
  cover.position.x = NW / 2;
  hinge.position.set(-NW / 2, 0, ND / 2);
  back.position.z = -ND / 2;
  hinge.add(cover);
  const LOOPS = 17;
  const spiral = new THREE.InstancedMesh(new THREE.TorusGeometry(.2, .018, 6, 20), std({ color: 0x1b1b1b, metalness: .8, roughness: .3 }), LOOPS);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < LOOPS; i++) {
    dummy.position.set(-NW / 2 + .02, -NH / 2 + .15 + i * (NH - .3) / (LOOPS - 1), 0);
    dummy.rotation.x = Math.PI / 2; // cincin di bidang XZ agar melingkari tepi kiri buku
    dummy.updateMatrix();
    spiral.setMatrixAt(i, dummy.matrix);
  }
  notebook.add(pages, hinge, back, spiral);

  // --- Ruang foto 2 → foto 3 ---
  const space = new THREE.Group();
  space.visible = false;
  world.add(space);

  const glowTex = radial([[0, 'rgba(255,255,255,1)'], [.2, 'rgba(255,255,255,.55)'], [.55, 'rgba(255,255,255,.12)'], [1, 'rgba(255,255,255,0)']]);
  const ringTex = canvasTex(512, 512, (g, w) => {
    g.strokeStyle = '#fff'; g.shadowColor = '#fff';
    [[40, 3], [14, 8]].forEach(([blur, lw]) => { g.shadowBlur = blur; g.lineWidth = lw; g.beginPath(); g.arc(w / 2, w / 2, w * .38, 0, Math.PI * 2); g.stroke(); });
  });
  const core = new THREE.Sprite(new THREE.SpriteMaterial(additive({ map: glowTex, color: 0xffcf85 })));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial(additive({ map: glowTex, color: 0x4f7dff, opacity: .7 })));
  const ringGlow = new THREE.Sprite(new THREE.SpriteMaterial(additive({ map: ringTex, color: 0xffe2b0 })));
  core.scale.setScalar(5.5);
  halo.scale.setScalar(11);
  ringGlow.scale.setScalar(7);
  [core, halo, ringGlow].forEach(s => { s.position.z = -.8; });

  const P = 700, pos = new Float32Array(P * 3);
  for (let i = 0; i < P; i++) {
    const r = rnd(2.5, 14), t = rnd(0, Math.PI * 2), p = Math.acos(rnd(-1, 1));
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.sin(p) * Math.sin(t), r * Math.cos(p) - 3], i * 3);
  }
  const dustGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial(additive({ map: glowTex, size: .12, color: 0xbfd4ff })));

  const orbitMat = new THREE.MeshBasicMaterial(additive({ color: 0xffc15a, opacity: 0 }));
  const orbits = [2.3, 2.9, 3.5].map((r, i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, .012, 6, 160), orbitMat);
    m.rotation.set(Math.PI / 2 - .35 + i * .12, i * .2 - .2, 0);
    return m;
  });

  const centerGroup = new THREE.Group();
  const ancientFront = std({ map: tex.ancient, emissive: 0xffffff, emissiveMap: tex.ancient, emissiveIntensity: .45 });
  const leatherMat = std({ map: tex.leather, roughness: .8 });
  const ancient = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.97, .3), [pageMat, leatherMat, pageMat, pageMat, ancientFront, leatherMat]);
  const WH = 5, img = tex.woman.image;
  const woman = new THREE.Mesh(new THREE.PlaneGeometry(WH * (img ? img.width / img.height : .6), WH),
    new THREE.MeshBasicMaterial({ map: tex.woman, transparent: true, opacity: 0, alphaTest: .02 }));
  woman.position.y = .1;
  woman.visible = false;
  centerGroup.add(ancient, woman);
  space.add(glowLight, halo, core, ringGlow, dust, ...orbits, centerGroup); // light ikut group: tidak menerangi notebook saat intro

  const ring = new THREE.Group();
  ring.rotation.set(.35, 0, -.42); // miring diagonal meniru arus buku pada foto 2
  space.add(ring);
  const leatherGeo = new THREE.BoxGeometry(.95, 1.25, .24);
  const noteGeo = new THREE.BoxGeometry(.9, 1.26, .12);
  const leatherFronts = [0xffffff, 0xd8b596, 0xa9876a].map(color => std({ map: tex.leather, color, roughness: .8 }));
  const spineMat = std({ color: 0x3a2213 });
  const coilMat = std({ color: 0x222222, metalness: .7, roughness: .35 });
  const noteCover = std({ map: tex.cover, roughness: .5 });
  const noteBoard = std({ color: 0xe8dccb });
  const RING = 10;
  const books = Array.from({ length: RING }, (_, i) => {
    const a = i / RING * Math.PI * 2, r = i % 2 ? 3.9 : 3.2, holder = new THREE.Group();
    holder.position.set(Math.cos(a) * r, rnd(-.35, .35), Math.sin(a) * r);
    holder.rotation.y = Math.PI / 2 - a; // arahkan sisi depan (+Z) keluar lingkaran
    holder.scale.setScalar(rnd(.8, 1.1));
    const lf = leatherFronts[i % 3];
    const m = new THREE.Mesh(leatherGeo, [pageMat, spineMat, pageMat, pageMat, lf, lf]);
    m.userData = {
      2: { geo: leatherGeo, mat: m.material },
      3: { geo: noteGeo, mat: [pageMat, coilMat, pageMat, pageMat, noteCover, noteBoard] }
    };
    m.scale.setScalar(.001);
    holder.add(m);
    ring.add(holder);
    return m;
  });

  const paperMat = std({ color: 0xf5efe3, side: THREE.DoubleSide, transparent: true, roughness: .9 });
  const paperGeo = new THREE.PlaneGeometry(.32, .42);
  const papers = Array.from({ length: 14 }, () => {
    const p = new THREE.Mesh(paperGeo, paperMat), a = rnd(0, Math.PI * 2), r = rnd(2.4, 4.8);
    p.position.set(Math.cos(a) * r, rnd(-.8, .8), Math.sin(a) * r);
    p.rotation.set(rnd(0, 6), rnd(0, 6), 0);
    p.userData.spin = rnd(.4, 1.4);
    ring.add(p);
    return p;
  });

  // --- Transisi foto 2 ⇄ foto 3 ---
  const rgb = hex => { const c = new THREE.Color(hex); return { r: c.r, g: c.g, b: c.b }; };
  let stage = 2, flipTl, spinning = false, spinVel = 0, ready = false;
  const flip = () => {
    if (flipTl?.isActive()) return;
    stage = stage === 2 ? 3 : 2;
    const to3 = stage === 3, [out, inn] = to3 ? [ancient, woman] : [woman, ancient];
    flipTl = gsap.timeline({ defaults: { duration: .8 } })
      .fromTo(core.scale, { x: 5.5, y: 5.5 }, { x: 9, y: 9, duration: .35, yoyo: true, repeat: 1, ease: 'power2.out' }, 0)
      .to(out.rotation, { y: Math.PI / 2, duration: .4, ease: 'power2.in' }, 0)
      .to(out.scale, { x: .6, y: .6, z: .6, duration: .4, ease: 'power2.in' }, 0)
      .to(woman.material, { opacity: to3 ? 1 : 0, duration: .5 }, to3 ? .4 : 0)
      .add(() => { out.visible = false; inn.visible = true; }, .4)
      .fromTo(inn.rotation, { y: -Math.PI / 2 }, { y: 0, ease: 'back.out(1.5)', immediateRender: false }, .4)
      .fromTo(inn.scale, { x: .6, y: .6, z: .6 }, { x: 1, y: 1, z: 1, ease: 'back.out(1.5)', immediateRender: false }, .4)
      .to(halo.material, { opacity: to3 ? 0 : .7 }, 0)
      .to(ringGlow.material.color, rgb(to3 ? 0xffb347 : 0xffe2b0), 0)
      .to(dust.material.color, rgb(to3 ? 0xffd27a : 0xbfd4ff), 0)
      .to(paperMat, { opacity: to3 ? 0 : 1 }, 0)
      .to(orbitMat, { opacity: to3 ? .85 : 0 }, .3)
      .to('.aurum', { opacity: to3 ? 1 : 0 }, 0);
    // Tukar geometri+material saat buku menghadap samping (90°) agar pergantian tidak terlihat.
    books.forEach((m, i) => {
      const at = .1 + i * .06;
      flipTl.to(m.rotation, { y: Math.PI / 2, duration: .3, ease: 'power2.in' }, at)
        .fromTo(m.rotation, { y: -Math.PI / 2 }, {
          y: 0, duration: .6, ease: 'back.out(1.8)', immediateRender: false,
          onStart: () => { m.geometry = m.userData[stage].geo; m.material = m.userData[stage].mat; }
        }, at + .3);
    });
  };

  // --- Interaksi touch/swipe ---
  let lastX = null, moved = 0;
  canvas.addEventListener('pointerdown', e => { lastX = e.clientX; moved = 0; });
  addEventListener('pointermove', e => {
    if (lastX === null || !spinning) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    moved += Math.abs(dx);
    ring.rotation.y += dx * .006;
    spinVel = gsap.utils.clamp(-4, 4, spinVel + dx * .01);
  });
  const release = e => {
    if (lastX !== null && e.type === 'pointerup' && moved < 8 && ready) flip();
    lastX = null;
  };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);

  const clock = new THREE.Clock();
  const tick = () => {
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    if (spinning) {
      ring.rotation.y += (.28 + spinVel) * dt;
      dust.rotation.y += dt * .03;
      orbits.forEach((o, i) => { o.rotation.z += dt * (.2 + i * .1) * (i % 2 ? -1 : 1); });
      papers.forEach(p => { p.rotation.x += dt * p.userData.spin; p.rotation.y += dt * p.userData.spin * .7; });
      ringGlow.material.rotation = t * .1;
      books.forEach((m, i) => { m.rotation.z = Math.sin(t + i) * .25; });
    }
    spinVel *= Math.exp(-3 * dt);
    const bob = Math.sin(t * 1.2) * .06;
    notebook.position.y = centerGroup.position.y = bob;
    renderer.render(scene, camera);
  };
  renderer.setAnimationLoop(tick);

  gsap.timeline({ scrollTrigger: {
    trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true,
    onLeave: () => renderer.setAnimationLoop(null),
    onEnterBack: () => { clock.getDelta(); renderer.setAnimationLoop(tick); }
  } })
    .to(world.rotation, { x: .5 }, 0)
    .to(world.position, { y: 2 }, 0)
    .to('.stage', { opacity: 0 }, 0);

  // --- Intro: buka notebook → kilat → ruang foto 2 → berubah foto 3 ---
  camera.position.z = 5.5;
  notebook.scale.setScalar(.001);
  notebook.rotation.set(.3, -.7, 0);
  ancient.scale.setScalar(.001);

  gsap.timeline({ defaults: { ease: 'power3.inOut' } })
    .to(notebook.scale, { x: 1, y: 1, z: 1, duration: 1.2, ease: 'back.out(1.4)' })
    .to(notebook.rotation, { x: 0, y: 0, duration: 1.3 }, '<.1')
    .to(hinge.rotation, { y: -Math.PI * .96, duration: 1.6 }, '+=.3')
    .to(pageFront, { emissiveIntensity: 2.5, duration: 1.6 }, '<')
    .to(camera.position, { z: 2.1, duration: 1.8, ease: 'power3.in' }, '<.3')
    .to('.flash', { opacity: 1, duration: .35, ease: 'power2.in' }, '-=.35')
    .add(() => {
      notebook.visible = false;
      [pages, cover, back].forEach(m => m.geometry.dispose());
      space.visible = spinning = true;
      camera.position.z = 10;
      gsap.set('.studio', { opacity: 0 });
      gsap.set('.space', { opacity: 1 });
    })
    .to('.flash', { opacity: 0, duration: 1.1, ease: 'power2.out' })
    .to(ancient.scale, { x: 1, y: 1, z: 1, duration: 1, ease: 'back.out(1.6)' }, '<')
    .to(books.map(b => b.scale), { x: 1, y: 1, z: 1, duration: 1, ease: 'back.out(1.6)', stagger: .07 }, '<.2')
    .from(books.map(b => b.rotation), { x: -Math.PI, duration: 1, ease: 'power2.out', stagger: .07 }, '<')
    .add(flip, '+=1.8')
    .to('.hero-copy > *', { opacity: 1, y: 0, duration: .8, ease: 'power2.out', stagger: .12 }, '+=1.4')
    .add(() => { ready = true; unlock(); });
}

initGL().catch(err => {
  console.error('WebGL gagal:', err);
  $('#gl').remove();
  renderer = camera = null;
  gsap.set('.hero-copy > *', { opacity: 1, y: 0 });
  gsap.set('.aurum', { opacity: 1 });
  unlock();
});

let resizeT;
function onResize() {
  clearTimeout(resizeT);
  // Debounce: keyboard HP / rotasi memicu resize beruntun; innerWidth baru stabil setelah beberapa frame.
  resizeT = setTimeout(() => {
    if (renderer && camera) {
      camera.aspect = innerWidth / innerHeight;
      camera.zoom = Math.min(1, camera.aspect * .9); // perlebar FOV di portrait agar cincin buku tidak terpotong
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    ScrollTrigger.refresh();
  }, 200);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);
</script>
</body>
</html>
